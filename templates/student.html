{% extends 'base.html' %}{% block heading %}Student Setup{% endblock %}{% block content %}<div class="card"><h3>Academic Profile</h3><p class="muted">Enter the student's information once. The planning tools use these values throughout the application.</p><form method="post" class="formgrid"><div><label>Student ID</label><input name="student_id" value="{{s['student_id']}}"></div><div><label>Full Name</label><input name="name" value="{{s['name']}}"></div><div><label>Email</label><input type="email" name="email" value="{{s['email']}}"></div><div><label>Major</label><select name="major">{% for x in ['Computer Engineering','Electrical Engineering','Computer Science','Other Engineering'] %}<option {% if s['major']==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div><label>Concentration</label><input name="concentration" value="{{s['concentration']}}" placeholder="Embedded Systems, etc."></div><div><label>Catalog Year</label><select name="catalog_year"><option>2026-2027</option><option>2025-2026</option><option>2024-2025</option><option>2023-2024</option></select></div><div><label>Academic Standing</label><select name="standing">{% for x in ['Freshman','Sophomore','Junior','Senior','Graduate'] %}<option {% if s['standing']==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div><label>GPA</label><input type="number" step="0.01" min="0" max="4" name="gpa" value="{{s['gpa']}}"></div><div><label>Credits Completed</label><input type="number" min="0" name="credits_completed" value="{{s['credits_completed']}}"></div><div><label>Total Degree Credits</label><input type="number" min="1" name="total_credits" value="{{s['total_credits']}}"></div><div><label>Target Graduation</label><select name="target_graduation">{% for t in ['Fall 2026','Spring 2027','Summer 2027','Fall 2027','Spring 2028','Summer 2028','Fall 2028','Spring 2029'] %}<option {% if s['target_graduation']==t %}selected{% endif %}>{{t}}</option>{% endfor %}</select></div><div><label>Target Credits / Term</label><input type="number" min="1" max="21" name="pace" value="{{s['pace']}}"></div><div class="wide"><button>Save Student Profile</button></div></form></div>{% endblock %}
