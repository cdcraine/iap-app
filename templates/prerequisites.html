{% extends 'base.html' %}{% block heading %}Prerequisite Manager{% endblock %}{% block content %}<div class="card"><h3>Create Course Dependency</h3><form method="post" class="formgrid"><div><label>Course</label><select name="course_id">{% for x in courses %}<option value="{{x['id']}}">{{x['code']}} — {{x['name']}}</option>{% endfor %}</select></div><div><label>Requires</label><select name="prereq_id">{% for x in courses %}<option value="{{x['id']}}">{{x['code']}} — {{x['name']}}</option>{% endfor %}</select></div><div><label>&nbsp;</label><button>Add Relationship</button></div></form></div><div class="card" style="margin-top:18px"><h3>Prerequisite Map</h3>{% for x in links %}<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin:8px 0"><b>{{x['prereq_code']}}</b><span>→</span><b>{{x['course_code']}}</b><form method="post" action="/prerequisite/delete"><input type="hidden" name="course_id" value="{{x['course_id']}}"><input type="hidden" name="prereq_id" value="{{x['prereq_id']}}"><button class="btn danger">Remove</button></form></div>{% else %}<p class="muted">No prerequisite relationships yet.</p>{% endfor %}</div>{% endblock %}
